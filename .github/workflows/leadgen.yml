name: Lead generation

# Runs every day at 06:00 UTC and on demand. `leadgen daily` discovers, enriches, scores, syncs
# to the Sales Portal, enrols into Smartlead, classifies replies and pulls stats. Each step is
# skipped when its keys are missing, so the same workflow works before outreach is switched on.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Discovery tool: legitscript | competitor | local | all (all = leadgen daily)"
        default: "all"
      discover_limit:
        description: "New candidates per tool"
        default: "100"
      enrich_limit:
        description: "Leads to enrich"
        default: "200"
      daily_cap:
        description: "Smartlead sends enrolment may commit to today (empty = portal/env default)"
        default: ""
      enroll:
        description: "Enrol into Smartlead (true/false); scheduled runs follow the LEADGEN_ENROLL repo variable"
        default: "false"
      classify:
        description: "Classify replies (true/false)"
        default: "true"

permissions:
  contents: read

# One run at a time: two overlapping runs would race on leads.db and could double-sync.
concurrency:
  group: leadgen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://zrrndxdnopvgspyhrsxh.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEADGEN_PORTAL_PROXY_URL: ${{ secrets.LEADGEN_PORTAL_PROXY_URL }}
      LEADGEN_PORTAL_TOKEN: ${{ secrets.LEADGEN_PORTAL_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      LUSHA_API_KEY: ${{ secrets.LUSHA_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      PUBLICWWW_API_KEY: ${{ secrets.PUBLICWWW_API_KEY }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
      SMARTLEAD_WEBHOOK_URL: ${{ secrets.SMARTLEAD_WEBHOOK_URL || vars.SMARTLEAD_WEBHOOK_URL }}
      SMARTLEAD_WEBHOOK_SECRET: ${{ secrets.SMARTLEAD_WEBHOOK_SECRET }}
      SMARTLEAD_EMAIL_ACCOUNT_IDS: ${{ vars.SMARTLEAD_EMAIL_ACCOUNT_IDS }}
      CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
      LEADGEN_BOOKING_URL: ${{ vars.LEADGEN_BOOKING_URL }}
      LEADGEN_OUTREACH_POSTAL_ADDRESS: ${{ vars.LEADGEN_OUTREACH_POSTAL_ADDRESS }}
      LEADGEN_OUTREACH_COMPANY_LEGAL_NAME: ${{ vars.LEADGEN_OUTREACH_COMPANY_LEGAL_NAME }}
      LEADGEN_OUTREACH_SENDER_NAME: ${{ vars.LEADGEN_OUTREACH_SENDER_NAME }}
      LEADGEN_DB: leads.db
      LEADGEN_MAX_PAGES_PER_SITE: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[llm]"
      - name: Restore lead store
        uses: actions/cache@v4
        with:
          path: leads.db
          key: leads-db-${{ github.run_id }}
          restore-keys: leads-db-
      # `leadgen daily` exits 1 when any step failed; the remaining steps still upload the
      # evidence, and the job is marked failed at the end so someone looks at it.
      - name: Run leadgen daily
        id: daily
        continue-on-error: true
        shell: bash
        run: |
          TOOL="${{ github.event.inputs.tool || 'all' }}"
          DL="${{ github.event.inputs.discover_limit || '100' }}"
          EL="${{ github.event.inputs.enrich_limit || '200' }}"
          if [ "$TOOL" != "all" ]; then
            LLM=""; [ -n "$ANTHROPIC_API_KEY" ] && LLM="--llm"
            leadgen discover "$TOOL" --limit "$DL"
            leadgen enrich "$TOOL" --limit "$EL" --workers 16 $LLM
            exit 0
          fi
          ARGS=(--discover-limit "$DL" --enrich-limit "$EL")
          CAP="${{ github.event.inputs.daily_cap }}"
          [ -n "$CAP" ] && ARGS+=(--daily-cap "$CAP")
          # enrolment is off unless the run asks for it or the repo variable LEADGEN_ENROLL is "true"
          [ "${{ github.event.inputs.enroll || vars.LEADGEN_ENROLL || 'false' }}" = "false" ] && ARGS+=(--no-enroll)
          [ "${{ github.event.inputs.classify || 'true' }}" = "false" ] && ARGS+=(--no-classify)
          leadgen daily "${ARGS[@]}" 2>&1 | tee daily.log
          exit "${PIPESTATUS[0]}"
      - name: Report
        if: always()
        shell: bash
        run: |
          leadgen stats
          leadgen top --n 30
          {
            echo "## Lead store"
            echo '```json'
            leadgen stats
            echo '```'
            if [ -f daily.log ]; then
              echo "## leadgen daily"
              echo '```'
              tail -n 40 daily.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          leadgen sync csv --all --out out/leads.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leads-${{ github.run_number }}
          path: out/leads.csv
      # WAL mode keeps recent writes in leads.db-wal; fold them into leads.db before it is
      # cached or uploaded so the single file is complete.
      - name: Checkpoint lead store
        if: always()
        run: python -c "import sqlite3; c = sqlite3.connect('leads.db'); c.execute('pragma wal_checkpoint(TRUNCATE)'); c.close()"
      # The cache can be evicted; an artifact per run is the durable copy of the evidence store.
      - name: Upload lead store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-db-${{ github.run_number }}
          path: leads.db
          if-no-files-found: warn
      - name: Fail if a daily step failed
        if: steps.daily.outcome == 'failure'
        run: exit 1
